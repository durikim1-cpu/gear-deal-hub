name: Automated Deal Pipeline & GitHub Pages Deploy

on:
  push:
    branches: ["main"]
  schedule:
    # Runs automatically every 6 hours (UTC) at $0 cost on public repositories
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow for Pinterest infographic card generation
        run: python -m pip install --upgrade pip pillow

      - name: Restore recent broadcast history
        uses: actions/cache/restore@v4
        with:
          path: data/sent_deals_history.json
          key: broadcast-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: broadcast-history-v1-

      - name: Restore unexpired offer cache
        uses: actions/cache/restore@v4
        with:
          path: data/live_offers_cache.json
          key: live-offers-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: live-offers-v1-

      - name: Build Gatekeeper-Verified Hub, Tools, KO/EN Guides, VS Battles & Pinterest RSS
        env:
          SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          COUPANG_PARTNERS_ID: ${{ secrets.COUPANG_PARTNERS_ID }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PINTEREST_VERIFY_CODE: ${{ secrets.PINTEREST_VERIFY_CODE }}
          NAVER_VERIFY_CODE: ${{ secrets.NAVER_VERIFY_CODE }}
          BING_VERIFY_CODE: ${{ secrets.BING_VERIFY_CODE }}
          LIVE_OFFERS_ENDPOINT: ${{ secrets.LIVE_OFFERS_ENDPOINT }}
          ANALYTICS_BEACON_URL: ${{ vars.ANALYTICS_BEACON_URL }}
        run: |
          python run_pipeline.py --live-network --auto-grow 3

      - name: Save unexpired offer cache
        if: ${{ !cancelled() && hashFiles('data/live_offers_cache.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/live_offers_cache.json
          key: live-offers-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Upload staged broadcast queue and sitemap
        uses: actions/upload-artifact@v4
        with:
          name: pending-broadcast
          path: |
            data/pending_broadcast.json
            dist/sitemap.xml
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-after-deploy:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download staged broadcast queue and sitemap
        uses: actions/download-artifact@v4
        with:
          name: pending-broadcast
          path: .

      - name: Restore recent broadcast history
        uses: actions/cache/restore@v4
        with:
          path: data/sent_deals_history.json
          key: broadcast-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: broadcast-history-v1-

      - name: Verify live public URLs (HTTP 200) and dispatch idempotent alerts
        env:
          SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_KO: ${{ secrets.TELEGRAM_CHAT_ID_KO }}
          TELEGRAM_CHAT_ID_EN: ${{ secrets.TELEGRAM_CHAT_ID_EN }}
          COUPANG_PARTNERS_ID: ${{ secrets.COUPANG_PARTNERS_ID }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          python run_pipeline.py --dispatch-deployed --send-telegram --publish-social

      - name: Save broadcast history for future runs
        if: ${{ !cancelled() && hashFiles('data/sent_deals_history.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/sent_deals_history.json
          key: broadcast-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
