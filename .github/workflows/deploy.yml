name: Automated Deal Pipeline & GitHub Pages Deploy

on:
  push:
    branches: ["main"]
  schedule:
    # Runs automatically every 6 hours (UTC) at $0 cost on public repositories
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow for Pinterest infographic card generation
        run: python -m pip install --upgrade pip pillow

      - name: Build Gatekeeper-Verified Hub, Tools, KO/EN Guides, VS Battles & Pinterest RSS
        env:
          SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          COUPANG_PARTNERS_ID: ${{ secrets.COUPANG_PARTNERS_ID }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PINTEREST_VERIFY_CODE: ${{ secrets.PINTEREST_VERIFY_CODE }}
          NAVER_VERIFY_CODE: ${{ secrets.NAVER_VERIFY_CODE }}
          BING_VERIFY_CODE: ${{ secrets.BING_VERIFY_CODE }}
          LIVE_OFFERS_ENDPOINT: ${{ secrets.LIVE_OFFERS_ENDPOINT }}
        run: |
          python run_pipeline.py --live-network --auto-grow 3

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Upload staged broadcast queue
        uses: actions/upload-artifact@v4
        with:
          name: pending-broadcast
          path: ./data/pending_broadcast.json
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-after-deploy:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download staged broadcast queue
        uses: actions/download-artifact@v4
        with:
          name: pending-broadcast
          path: ./data

      - name: Verify live public URLs (HTTP 200) and dispatch idempotent alerts
        env:
          SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_KO: ${{ secrets.TELEGRAM_CHAT_ID_KO }}
          TELEGRAM_CHAT_ID_EN: ${{ secrets.TELEGRAM_CHAT_ID_EN }}
          COUPANG_PARTNERS_ID: ${{ secrets.COUPANG_PARTNERS_ID }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          python run_pipeline.py --dispatch-deployed --send-telegram --publish-social
